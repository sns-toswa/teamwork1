<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>PetX – Магазин тваринок</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    margin: 0;
    background: linear-gradient(120deg, #f5f6fa, #e0e8ff 60%, #ffedfa);
    font-family: "Segoe UI", "Arial", sans-serif;
    animation: fadeIn 1.2s both;
    min-height: 100vh;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
/* =================== МЕНЮ =================== */
nav {
    background: linear-gradient(90deg, #fff, #e0eaff 70%, #f8fff1 100%);
    display: flex;
    justify-content: center;
    gap: 45px;
    padding: 20px 0 18px 0;
    box-shadow: 0 4px 16px 2px rgba(48,82,204,0.13), 0 1.5px 0 #cfffab;
    position: sticky;
    top: 0;
    z-index: 999;
    border-bottom-left-radius: 19px;
    border-bottom-right-radius: 21px;
}
nav button {
    border: none;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    padding: 14px 32px;
    margin: 0 8px;
    border-radius: 15px;
    transition: 0.21s, box-shadow 0.21s, border-color .23s;
    background: linear-gradient(90deg,#ffd7e7 10%, #b9f7ff 65%, #dbffd4 90%);
    color: #272c95;
    text-shadow: 0 1px 10px #fff9, 0 0.5px 2px #aefffd40;
    letter-spacing: 0.5px;
    outline: none;
    position: relative;
    border: 2px solid transparent;
    opacity: 0.94;
}
nav button:hover, nav button.active {
    background: linear-gradient(90deg,#1fcfff 10%, #9ffc6d 71%, #fc8eb2 100%);
    color: #061a3e;
    box-shadow: 0 9px 28px 0 #f2b2ff72, 0 2.5px 0 #bafaae;
    transform: scale(1.075) translateY(-2.5px);
    border: 2.5px solid rgba(45,45,70,0.13);
    opacity: 1;
}
nav .secondary-btn {
    background: linear-gradient(91deg,#ffc4d7,#b7f5ff 65%,#fffbae 100%);
    color: #21394f;
}
nav .special-btn {
    background: linear-gradient(90deg, #fffafc, #fc6db0 38%, #a0f8ff 85%);
    color: #6c0d4c;
    box-shadow: 0 4px 16px #ffb3d448;
    border: 2px solid #f3dfff18 !important;
}
nav .special-btn:hover {
    background: linear-gradient(90deg, #fc98d9, #ecfcff 85%);
    color: #195b7a;
    border-color: #a3fde7 !important;
}
nav .glass-btn {
    background: rgba(255,255,255,0.55);
    color: #1e256a;
    border: 2px solid rgba(15,40,80,0.24);
    box-shadow: none;
    opacity: 0.86;
    font-size: 17px; /* Менший розмір */
    padding: 10px 19px; /* Менше */
}
nav .glass-btn:hover {
    background: rgba(240,246,255,0.81);
    border: 2px solid rgba(56,56,96,0.19);
    color: #50549a;
}
#logout-btn {
    position: absolute;
    top:14px; right:20px;
    font-size:16px;
    border:none;
    background:rgba(253,219,241,0.63);
    color:#cf2561;
    padding:6px 16px;
    border-radius:11px;
    cursor:pointer;
    z-index:999;
    transition:background .18s;
    display: none;
}
#logout-btn:hover {background:rgba(251,161,241,0.77); color:#482239;}
/* ... решта CSS без змін ... */
</style>
</head>
<body>
<!-- ---------------- MENU ---------------- -->
<nav>
    <button id="homeBtn" onclick="showHome()" class="active">🏠 Головна</button>
    <button id="shopBtn" onclick="showShop()" class="secondary-btn">🛒 Магазин</button>
    <button onclick="showToast('Акція тижня! 10% знижка на всіх котів 🐱')" class="special-btn">🔥 Акції</button>
    <button id="profileNavBtn" onclick="showProfile()" class="glass-btn" style="display:none;">👤 Профіль</button>
    <button onclick="showAuthForm('register')" class="glass-btn" id="registerNavBtn">Реєстрація</button>
    <button onclick="showAuthForm('login')" class="glass-btn" id="loginNavBtn">Вхід</button>
    <button id="logout-btn" onclick="logout()" style="display:none;">Вийти</button>
</nav>
<!-- ---------------- HOME PAGE ---------------- -->
<section id="home">
    <img class="home-leaves" src="https://cdn-icons-png.flaticon.com/512/735/735846.png" alt="">
    <img class="home-dog" src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="">
    <h1 id="home-title">🐾 Ласкаво просимо в PetX!</h1>
    <p id="home-desc">Купуй та продавай тваринок легко і безпечно.<br>
       Обирай друга – анімована колекція з ❤️</p>
    <div class="hero-img-box">
        <img id="home-img" class="hero-img" src="https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=900&q=80" alt="cat-dog">
    </div>
    <button class="special-offer" style="margin-top:39px;" onclick="showShop()">Перейти в магазин</button>
</section>
<!-- ---------------- SHOP PAGE ---------------- -->
<section id="shop" style="display:none">
    <div class="header-shop">
        <h2>🛒 Магазин тваринок</h2>
        <input id="search" type="text" placeholder="Пошук...">
        <select id="category">
            <option value="all">Всі категорії</option>
            <option value="cat">Коти</option>
            <option value="dog">Собаки</option>
            <option value="small">Малі тварини</option>
            <option value="exotic">Екзотичні</option>
            <option value="bird">Птахи</option>
        </select>
    </div>
    <div id="admin-panel">
        <h3>Додати тварину (адмін)</h3>
        <label>Категорія:
            <select id="add-category">
                <option value="cat">Кіт</option>
                <option value="dog">Собака</option>
                <option value="small">Мала тварина</option>
                <option value="exotic">Екзотика</option>
                <option value="bird">Птах</option>
            </select>
        </label><br>
        <label>Назва:<br>
            <input id="add-name" type="text" maxlength="40" required>
        </label><br>
        <label>Опис:<br>
            <textarea id="add-desc" maxlength="120"></textarea>
        </label><br>
        <label>Ціна:<br>
            <input id="add-price" type="text" maxlength="12" required placeholder="Напр. 4000 ₴">
        </label><br>
        <label>Зображення (посилання):<br>
            <input id="add-img" type="url" required placeholder="https://...">
        </label><br>
        <button onclick="addNewPet()">Додати в магазин</button>
    </div>
    <div class="container" id="list"></div>
</section>
<!-- === PROFILE SECTION === -->
<section id="profile" style="display:none; max-width:400px; margin:40px auto; background:#fff; border-radius:22px; box-shadow:0 4px 18px #c6d7ff50; padding:36px 23px 30px;">
    <h2 style="text-align:center;color:#2a437e;">👤 Профіль</h2>
    <div id="profileData"></div>
    <button onclick="showChangePass()" style="margin-top:13px;">Змінити пароль</button>
    <div id="changePassBox" style="display:none;margin-top:15px;">
        <input type="password" id="newPass" placeholder="Новий пароль" style="padding:7px 12px;border-radius:7px;">
        <button onclick="changePass()">Змінити</button>
    </div>
</section>
<!-- === SITE CONSTRUCTOR SECTION FOR ADMIN === -->
<section id="site-constructor" style="display:none; max-width:600px; margin:40px auto; background:#fafaff; border-radius:21px; box-shadow:0 4px 28px #cd9df933; padding:33px 21px 30px;">
    <h2>🛠️ Конструктор головної сторінки</h2>
    <label>Заголовок:<br>
        <input id="cons-title" maxlength="60" style="width:95%;padding:9px 13px;border-radius:7px;">
    </label><br>
    <label>Опис:<br>
        <textarea id="cons-desc" maxlength="300" style="width:95%;min-height:48px;border-radius:7px;"></textarea>
    </label><br>
    <label>Головне зображення (URL):<br>
        <input id="cons-img" type="url" style="width:95%;padding:9px 13px;border-radius:7px;">
    </label><br>
    <button onclick="saveConstruct()" style="margin-top:12px;">Зберегти зміни</button>
</section>
<!-- ===== AUTH MODAL ===== -->
<div id="auth-form-bg">
    <form id="auth-form" onsubmit="return false;">
        <h2 id="auth-title">Реєстрація</h2>
        <input id="auth-username" type="text" maxlength="20" required placeholder="Логін">
        <input id="auth-password" type="password" maxlength="24" required placeholder="Пароль">
        <button id="auth-btn" type="button" onclick="onAuth()">Далі</button>
        <div style="margin-top: 15px;">
            <a href="#" id="switch-auth" style="font-size:16px;color:#1e256a;">Вже є акаунт?</a>
        </div>
    </form>
</div>
<!-- ===== POPUP ===== -->
<div id="popup-bg">
    <div id="popup">
        <img id="p-img" alt>
        <h2 id="p-title"></h2>
        <p id="p-type"></p>
        <p id="p-desc" style="font-size:17px; color:#2c375e"></p>
        <p id="p-price"></p>
        <button class="close" onclick="closePopup()">Закрити</button>
    </div>
</div>
<div id="toast-root"></div>
<script>
// === PERSISTENT DATA (pets, users, main page content) ===
let pets = JSON.parse(localStorage.getItem('pets_v2')||'null') || [
    {cat: "cat", img:"https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=800&q=80", name:"Британське кошеня", desc:"Миле сіре кошеня, лагідний характер.", price:"4000 ₴", type:"Кішка"},
    {cat: "cat", img:"https://images.unsplash.com/photo-1518715308788-3005759c41b0?auto=format&fit=crop&w=800&q=80", name:"Шотландський висловухий", desc:"Муркотливе творіння з кумедними вушками.", price:"3700 ₴", type:"Кішка"},
    {cat: "cat", img:"https://images.unsplash.com/photo-1558944355-c1e96b1c414c?auto=format&fit=crop&w=800&q=80", name:"Мейн-кун", desc:"Величезна, розумна, пухнаста кішка.", price:"6700 ₴", type:"Кішка"},
    {cat: "dog", img:"https://images.unsplash.com/photo-1518715308788-3005759c41b1?auto=format&fit=crop&w=800&q=80", name:"Лабрадор", desc:"Дружній сімейний собака, обожнює дітей.", price:"8500 ₴", type:"Собака"},
    {cat: "dog", img:"https://images.unsplash.com/photo-1507146426996-ef05306b995a?auto=format&fit=crop&w=800&q=80", name:"Німецька вівчарка", desc:"Розумний сторож, дуже відданий.", price:"12000 ₴", type:"Собака"},
    {cat: "small", img:"https://images.unsplash.com/photo-1518715308788-3005759c41b4?auto=format&fit=crop&w=800&q=80", name:"Хом’як сирійський", desc:"Маленький пухнастик для дітей.", price:"290 ₴", type:"Гризун"},
    {cat: "bird", img:"https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=800&q=80", name:"Хвилястий папуга", desc:"Яскравий улюбленець для спілкування.", price:"320 ₴", type:"Птах"},
    {cat: "exotic", img:"https://images.unsplash.com/photo-1464983953574-0892a716854b?auto=format&fit=crop&w=800&q=80", name:"Хамелеон пантеровий", desc:"Кольоровий хамелеон, екзотика для досвідчених.", price:"2480 ₴", type:"Екзотика"}
];
let users = JSON.parse(localStorage.getItem('users_v1')||'{}');
let currentUser = localStorage.getItem('currentUser') || null;
let homeContent = JSON.parse(localStorage.getItem('mainpage_v1')||'null') || {
    title:"🐾 Ласкаво просимо в PetX!",
    desc:"Купуй та продавай тваринок легко і безпечно.<br>Обирай друга – анімована колекція з ❤️",
    img:"https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=900&q=80"
};
// === SITE CONSTRUCTOR LOGIC (admin only) ===
function openConstructor(){
    document.getElementById('site-constructor').style.display='block';
    document.getElementById('cons-title').value = homeContent.title || "";
    document.getElementById('cons-desc').value = homeContent.desc || "";
    document.getElementById('cons-img').value = homeContent.img || "";
}
function saveConstruct(){
    let t = document.getElementById('cons-title').value.trim() || "🐾 Ласкаво просимо в PetX!";
    let d = document.getElementById('cons-desc').value.trim() || "";
    let i = document.getElementById('cons-img').value.trim() || "";
    homeContent = {title:t, desc:d, img:i};
    localStorage.setItem('mainpage_v1', JSON.stringify(homeContent));
    renderHomeMain();
    showToast("Головна сторінка оновлена!");
}
// === PROFILE SECTION LOGIC ===
function showProfile() {
    switchBtn();
    document.getElementById("profile").style.display = "block";
    document.getElementById("home").style.display = "none";
    document.getElementById("shop").style.display = "none";
    document.getElementById("site-constructor").style.display = "none";
    let info = "<b>Логін:</b> "+(currentUser||"")+(currentUser==="admin"?" <b>(адмін)</b>":"");
    document.getElementById("profileData").innerHTML = info;
    document.getElementById("changePassBox").style.display = "none";
}
function showChangePass() {
    document.getElementById("changePassBox").style.display = "block";
}
function changePass() {
    let np = document.getElementById("newPass").value;
    if(np.length<5){ showToast("Пароль закороткий!"); return;}
    if(currentUser==="admin"){ showToast("Для адміна пароль змінювати не можна"); return; }
    users[currentUser]=np;
    localStorage.setItem('users_v1', JSON.stringify(users));
    showToast("Пароль змінено");
    document.getElementById("changePassBox").style.display = "none";
}
// === ГОЛОВНА ДИНАМІЧНО ===
function renderHomeMain() {
    document.getElementById("home-title").innerHTML = homeContent.title;
    document.getElementById("home-desc").innerHTML = homeContent.desc;
    document.getElementById("home-img").src = homeContent.img;
    document.getElementById("home-img").alt = homeContent.title;
}
renderHomeMain();
// ------------------ КАТАЛОГ, РЕНДЕР --------------------
function renderPets() {
    let list = document.getElementById('list');
    list.innerHTML = '';
    let q = (document.getElementById("search")||{value:""}).value?.trim().toLowerCase() || "";
    let cat = (document.getElementById("category")||{value:"all"}).value;
    pets.forEach((p, idx) => {
        let display = true;
        if (q && !(p.name.toLowerCase().includes(q) || (p.desc||"").toLowerCase().includes(q))) display = false;
        if (cat !== "all" && p.cat !== cat) display = false;
        if(!display) return;
        let card = document.createElement('div');
        card.className = 'card';
        card.dataset.cat = p.cat;
        card.innerHTML = `
            <img src="${p.img}" alt="${p.name}">
            <h3>${p.name}</h3>
            <p class="card-type">${p.type||''}</p>
            <p class="price">${p.price||''}</p>
            <button class="more-btn" onclick="openCard('${escapeStr(p.name)}','${escapeStr(p.img)}','${escapeStr(p.price)}','${escapeStr(p.type)}','${escapeStr(p.desc||'')}')">Детальніше</button>
            <button class="buy-btn" onclick="showToast('Запит на покупку \"${p.name}\" відправлено! 🤗')">Купити</button>
            <button class="fav-btn" onclick="showToast('Додано в улюблене 💗')">💗 Улюбити</button>
            <button class="special-offer" onclick="showToast('Вибрано спеціальну пропозицію для: ${p.name} 🎁')">🤩 Пропозиція</button>
        `;
        list.appendChild(card);
    });
}
renderPets();
// === Зберігати pets після кожного додавання
function persistPets(){
    localStorage.setItem('pets_v2',JSON.stringify(pets));
}
// ----------------- ПОШУК ---------------------
document.getElementById("search").addEventListener("input", ()=>{
    renderPets();
});
// ---------------- ФІЛЬТР -----------------
document.getElementById("category").addEventListener("change", ()=>{
    renderPets();
});
// ---------------- CARDS POPUP ----------------------
function openCard(title, img, price, type = "", desc = "") {
    document.getElementById("p-title").innerText = title;
    document.getElementById("p-img").src = img;
    document.getElementById("p-img").alt = title;
    document.getElementById("p-price").innerText = price;
    document.getElementById("p-type").innerText = type ? "Тип: "+type : "";
    document.getElementById("p-desc").innerText = desc ? desc : "";
    document.getElementById("popup-bg").style.display = "flex";
}
function closePopup() {
    document.getElementById("popup-bg").style.display = "none";
}
// ---------------- TOAST (сповіщення) ---------------------
function showToast(msg) {
    let toastRoot = document.getElementById('toast-root');
    let t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = msg;
    toastRoot.appendChild(t);
    setTimeout(()=>{ t.style.opacity=0; setTimeout(()=>t.remove(),350)}, 2100);
}
// ----------------- AUTH ------------------
function showAuthForm(mode) {
    let bg = document.getElementById('auth-form-bg');
    let title = document.getElementById('auth-title');
    let submitBtn = document.getElementById('auth-btn');
    let link = document.getElementById('switch-auth');
    let form = document.getElementById('auth-form');
    form.reset();
    if (mode === "register") {
        title.innerText = "Реєстрація";
        submitBtn.innerText = "Зареєструватися";
        link.innerText = "Вже є акаунт?";
        link.onclick = ()=>showAuthForm('login');
        submitBtn.onclick = doRegister;
    } else {
        title.innerText = "Вхід";
        submitBtn.innerText = "Увійти";
        link.innerText = "Створити новий акаунт";
        link.onclick = ()=>showAuthForm('register');
        submitBtn.onclick = doLogin;
    }
    bg.style.display = "flex";
}
function closeAuthForm() {
    document.getElementById('auth-form-bg').style.display = "none";
}
// ---- Register & Login Logic (імітація через localStorage) ----
function doRegister() {
    let user = document.getElementById('auth-username').value.trim();
    let pass = document.getElementById('auth-password').value;
    if (user.length<3 || pass.length<5) {
        showToast('Логін або пароль закороткі');
        return;
    }
    if (users[user]) {
        showToast('Такий логін вже існує.');
        return;
    }
    users[user] = pass;
    localStorage.setItem('users_v1', JSON.stringify(users));
    localStorage.setItem('currentUser', user);
    currentUser = user;
    updateAuthUI();
    closeAuthForm();
    showToast('Реєстрація успішна!');
}
function doLogin() {
    let user = document.getElementById('auth-username').value.trim();
    let pass = document.getElementById('auth-password').value;
    if ((user === "admin" && pass === "123123123")
        || (users[user] && users[user] === pass)) {
        localStorage.setItem('currentUser', user);
        currentUser = user;
        updateAuthUI();
        closeAuthForm();
        showToast('Вхід виконано!');
    } else {
        showToast('Помилка авторизації');
    }
}
function logout() {
    localStorage.removeItem('currentUser');
    currentUser = null;
    updateAuthUI();
    showToast('Ви вийшли з акаунта');
}
function updateAuthUI() {
    document.getElementById('logout-btn').style.display = currentUser ? "" : "none";
    document.getElementById('registerNavBtn').style.display = currentUser ? "none" : "";
    document.getElementById('loginNavBtn').style.display = currentUser ? "none" : "";
    document.getElementById('profileNavBtn').style.display = currentUser ? "" : "none";
    document.getElementById('admin-panel').style.display = (currentUser==="admin") ? "" : "none";
    document.getElementById('site-constructor').style.display = "none";
    document.getElementById('profile').style.display = "none";
    if(currentUser==="admin"){ 
        document.getElementById('site-constructor').style.display="block";
        openConstructor();
    }
}
updateAuthUI();
// --------------- ADMIN: Додає тваринку -----------------
function addNewPet() {
    let cat = document.getElementById('add-category').value;
    let name = document.getElementById('add-name').value.trim();
    let desc = document.getElementById('add-desc').value.trim();
    let price = document.getElementById('add-price').value.trim();
    let img = document.getElementById('add-img').value.trim();
    if (!cat || !name || !price || !img) {
        showToast('Заповніть усі поля!');
        return;
    }
    pets.push({
        cat, name, desc, price,
        img, type: (cat==="cat" ? "Кішка": cat==="dog"?"Собака":cat==="small"?"Гризун":cat==="bird"?"Птах":"Екзотика")
    });
    persistPets();
    renderPets();
    showToast('Додано!');
    document.getElementById('add-name').value="";
    document.getElementById('add-desc').value="";
    document.getElementById('add-price').value="";
    document.getElementById('add-img').value="";
}
// ------------ Навігація ----------------
function switchBtn(activeId) {
    homeBtn.classList.remove('active');
    shopBtn.classList.remove('active');
    if(activeId) document.getElementById(activeId).classList.add('active');
}
function showHome() {
    switchBtn('homeBtn');
    home.style.display = "block";
    shop.style.display = "none";
    document.getElementById('site-constructor').style.display = "none";
    document.getElementById('profile').style.display = "none";
    window.scrollTo({top:0, behavior:"smooth"});
}
function showShop() {
    switchBtn('shopBtn');
    home.style.display = "none";
    shop.style.display = "block";
    document.getElementById('site-constructor').style.display = (currentUser==="admin")?"block":"none";
    document.getElementById('profile').style.display = "none";
    window.scrollTo({top:0, behavior:"smooth"});
}
// Допоміжне
function escapeStr(s) {
    return String(s).replace(/'/g,"&#39;").replace(/"/g,"&quot;");
}
document.getElementById('auth-form-bg').addEventListener('click', function(e){
    if (e.target===this) closeAuthForm();
});
</script>
</body>
</html>
